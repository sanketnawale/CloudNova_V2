kind = "web"
previewPath = "/"
title = "CloudNova"
version = "1.0.0"
id = "artifacts/cloudnova"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25469

[services.development]
run = "pnpm --filter @workspace/cloudnova run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloudnova", "run", "build" ]
publicDir = "artifacts/cloudnova/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25469"
BASE_PATH = "/"
