kind = "web"
previewPath = "/"
title = "CloudNoiva"
version = "1.0.0"
id = "artifacts/cloudnoiva"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25469

[services.development]
run = "pnpm --filter @workspace/cloudnoiva run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloudnoiva", "run", "build" ]
publicDir = "artifacts/cloudnoiva/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25469"
BASE_PATH = "/"
